# videowall configuration
# Managed by install.sh -> ~/.config/videowall/videowall.conf

# Source video file (REQUIRED). Absolute path to your wallpaper video.
VIDEO="/path/to/your/wallpaper.mp4"

# Monitor to display the wallpaper on:
#   ALL            -> every monitor
#   <monitor name> -> only that monitor (see `hyprctl monitors -j`)
MONITOR="ALL"

# Extra mpv options appended to the default set (optional).
# Example: MPV_OPTS="--no-border"
MPV_OPTS=""

# Where the generated 1080p faststart copy is stored (optional).
# Defaults to ~/.local/share/wallpapers/
#WALLPAPER_DIR="$HOME/.local/share/wallpapers"